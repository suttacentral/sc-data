     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 10
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    若比丘尼作是語。何用是雜碎
    <a class="ref t" href="#t0085b22" id="t0085b22">
     T 0085b22
    </a>
    戒為。說是戒時令人憂惱。作如是毀訾戒者
    <a class="ref t" href="#t0085b23" id="t0085b23">
     T 0085b23
    </a>
    波逸提。
    <span class="rule-number">
     十事竟
    </span>
   </p>
