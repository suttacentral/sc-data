     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 21
     </span>
     <span class="mirror-right">
     </span>

   <h3 class="latin">
    Chapter 3
   </h3>
   <p>
    若比丘尼受別請眾食。除因緣波逸提。因緣
    <a class="ref t" href="#t0085c12" id="t0085c12">
     T 0085c12
    </a>
    者。病時衣時施衣時作衣時行路時船上行
    <a class="ref t" href="#t0085c13" id="t0085c13">
     T 0085c13
    </a>
    時大會時。是名因緣。
   </p>
