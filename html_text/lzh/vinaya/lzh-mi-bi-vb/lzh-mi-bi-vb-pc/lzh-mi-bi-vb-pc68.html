   <p>
    若比丘尼作修伽陀衣量
    <a class="ref t" href="#t0086c04" id="t0086c04">
     T 0086c04
    </a>
    衣。若過波逸提。修伽陀衣量者。長九修伽陀
    <a class="ref t" href="#t0086c05" id="t0086c05">
     T 0086c05
    </a>
    <span class="t-gaiji">
     搩
     <!--gaiji,,1[打-丁+桀],2&#x6429;,3-->
    </span>
    手廣六
    <span class="t-gaiji">
     搩
     <!--gaiji,,1[打-丁+桀],2&#x6429;,3-->
    </span>
    手。是名修伽陀衣量。
