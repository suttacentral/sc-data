     </span>
    </p>
    <p class="mirror-row">
     <span class="mirror-left latin">
      Bhikkhu Vibhaṅga
     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 52
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    <a class="ref sc" href="#sc7" id="sc7">
     SC 7
    </a>
    若比丘尼若寶若寶等物。若自取若使人取。
    <a class="ref t" href="#t0086b08" id="t0086b08">
     T 0086b08
    </a>
    除僧坊內及宿處波逸提。若僧坊內及宿處。
    <a class="ref t" href="#t0086b09" id="t0086b09">
     T 0086b09
    </a>
    取寶寶等物。後有主索應還。是事應爾。
   </p>
