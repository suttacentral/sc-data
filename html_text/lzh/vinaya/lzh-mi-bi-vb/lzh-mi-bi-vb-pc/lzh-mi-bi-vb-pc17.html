    <p class="mirror-row">
     <span class="mirror-left latin">
      Bhikkhu Vibhaṅga
     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 17
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    若比丘尼知他先敷臥具。從來強自敷
    <a class="ref t" href="#t0085c05" id="t0085c05">
     T 0085c05
    </a>
    若使人敷作是念。若不樂者自當出去波逸
    <a class="ref t" href="#t0085c06" id="t0085c06">
     T 0085c06
    </a>
    提。
   </p>
