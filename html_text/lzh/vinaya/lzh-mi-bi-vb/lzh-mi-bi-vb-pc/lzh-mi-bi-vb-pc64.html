     <span class="mirror-left latin">

     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 64
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    若比
    <a class="ref t" href="#t0086b27" id="t0086b27">
     T 0086b27
    </a>
    丘尼受他請。食前食後行到諸家。不近白餘
    <a class="ref t" href="#t0086b28" id="t0086b28">
     T 0086b28
    </a>
    比丘尼。除因緣波逸提。因緣者。衣時是名因
    <a class="ref t" href="#t0086b29" id="t0086b29">
     T 0086b29
    </a>
    緣。
   </p>
