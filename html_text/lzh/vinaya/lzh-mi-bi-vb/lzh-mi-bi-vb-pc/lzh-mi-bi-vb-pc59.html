    <p class="mirror-row">

     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 59
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    若比丘尼新得衣應三種色作幟。
    <a class="ref t" href="#t0086b19" id="t0086b19">
     T 0086b19
    </a>
    若青若黑若木蘭。若不以三色作幟波逸
    <a class="ref t" href="#t0086b20" id="t0086b20">
     T 0086b20
    </a>
    提。
   </p>
