    <p class="mirror-row">
     <span class="mirror-left latin">

     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 60
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    若比丘尼為戲笑故。藏比丘尼若衣若
    <span class="t-gaiji">
     鉢
     <!--gaiji,缽,1[金*本],2&#x9262;,3-->
    </span>
    <a class="ref t" href="#t0086b21" id="t0086b21">
     T 0086b21
    </a>
    若坐具針筒。如是一一生活具。若使人藏波
    <a class="ref t" href="#t0086b22" id="t0086b22">
     T 0086b22
    </a>
    逸提。
   </p>
