   <p>
    若比
    <a class="ref t" href="#t0086b10" id="t0086b10">
     T 0086b10
    </a>
    丘尼半月內浴。除因緣波逸提。因緣者。病時
    <a class="ref t" href="#t0086b11" id="t0086b11">
     T 0086b11
    </a>
    作時行路時風雨時熱時。是名因緣。
   </p>
