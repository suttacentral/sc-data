    <p class="mirror-row">
     <span class="mirror-left latin">
      Bhikkhu Vibhaṅga
     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 16
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    若比丘尼瞋不喜。於僧房中自牽比丘尼
    <a class="ref t" href="#t0085c03" id="t0085c03">
     T 0085c03
    </a>
    出若使人牽。作是語出去滅去莫此中住波
    <a class="ref t" href="#t0085c04" id="t0085c04">
     T 0085c04
    </a>
    逸提。
   </p>
