    <p class="division">
     <span class="mirror-left latin">
      Mahīśāsaka Vinaya
     </span>
     <span class="mirror-right">
      五分律（彌沙塞）
     </span>
    </p>
    <p class="mirror-row">
     <span class="mirror-left latin">
      Bhikkhu Vibhaṅga
     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 23
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    <a class="ref sc" href="#sc2" id="sc2">
     SC 2
    </a>
    若比丘尼到白衣家。自
    <a class="ref t" href="#t0085c15" id="t0085c15">
     T 0085c15
    </a>
    恣多與飲食若
    <span class="t-gaiji">
     餅
     <!--gaiji,餅,1[麩-夫+并],2&#x4D35;,3-->
    </span>
    若
    <span class="t-gaiji">
     麨
     <!--gaiji,,1[麩-夫+少],2&#x9EA8;,3-->
    </span>
    。若不住其家食。受
    <a class="ref t" href="#t0085c16" id="t0085c16">
     T 0085c16
    </a>
    二三
    <span class="t-gaiji">
     鉢
     <!--gaiji,缽,1[金*本],2&#x9262;,3-->
    </span>
    應受出外。應與餘比丘尼共食。若無
    <a class="ref t" href="#t0085c17" id="t0085c17">
     T 0085c17
    </a>
    病過是受及不與餘比丘尼共食波逸提。
   </p>
