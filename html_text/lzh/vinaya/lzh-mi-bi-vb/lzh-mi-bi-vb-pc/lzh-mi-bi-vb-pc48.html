     <span class="mirror-right">
      五分律（彌沙塞）
     </span>
    </p>
    <p class="mirror-row">
     <span class="mirror-left latin">
      Bhikkhu Vibhaṅga
     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 48
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    <a class="ref sc" href="#sc6" id="sc6">
     SC 6
    </a>
    若比丘尼說戒時。作是語我今始知
    <a class="ref t" href="#t0086a28" id="t0086a28">
     T 0086a28
    </a>
    是法半月布薩戒經中說。諸比丘尼知是比
    <a class="ref t" href="#t0086a29" id="t0086a29">
     T 0086a29
    </a>
    丘尼已再三說戒中坐。是比丘尼不以不知
    <a class="ref t" href="#t0086b01" id="t0086b01">
     T 0086b01
    </a>
    故得脫。隨所犯罪如法治。應訶其不知。汝所
    <a class="ref t" href="#t0086b02" id="t0086b02">
     T 0086b02
    </a>
    作不善。說戒時不一心聽。不著心中波逸提。
    <a class="ref t" href="#t0086b03" id="t0086b03">
     T 0086b03
    </a>
   </p>
