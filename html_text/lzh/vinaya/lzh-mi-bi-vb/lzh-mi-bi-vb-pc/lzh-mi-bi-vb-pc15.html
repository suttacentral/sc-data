    </p>
    <p class="mirror-row">
     <span class="mirror-left latin">
      Bhikkhu Vibhaṅga
     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 15
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    若比丘尼
    <a class="ref t" href="#t0085b29" id="t0085b29">
     T 0085b29
    </a>
    於僧房內自敷僧臥具。若使人敷若他敷若
    <a class="ref t" href="#t0085c01" id="t0085c01">
     T 0085c01
    </a>
    坐若臥。去時不自舉不教人舉不囑舉波逸
    <a class="ref t" href="#t0085c02" id="t0085c02">
     T 0085c02
    </a>
    提。
   </p>
