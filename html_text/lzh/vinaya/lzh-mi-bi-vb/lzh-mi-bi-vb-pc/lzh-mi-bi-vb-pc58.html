     </span>
    </p>
    <p class="mirror-row">
     <span class="mirror-left latin">
      Bhikkhu Vibhaṅga
     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 58
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    <a class="ref sc" href="#sc8" id="sc8">
     SC 8
    </a>
    若比丘尼語彼比丘尼。共到
    <a class="ref t" href="#t0086b16" id="t0086b16">
     T 0086b16
    </a>
    諸家與汝多美飲食。既到不與作是語。汝去
    <a class="ref t" href="#t0086b17" id="t0086b17">
     T 0086b17
    </a>
    共汝若坐若語不樂。我獨坐獨語樂。欲令惱
    <a class="ref t" href="#t0086b18" id="t0086b18">
     T 0086b18
    </a>
    故波逸提。
   </p>
