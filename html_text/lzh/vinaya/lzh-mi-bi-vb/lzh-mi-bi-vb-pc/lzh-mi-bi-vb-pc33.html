      五分律（彌沙塞）
     </span>
    </p>
    <p class="mirror-row">
     <span class="mirror-left latin">
      Bhikkhu Vibhaṅga
     </span>
     <span class="mirror-right">
      比丘尼分
     </span>
    </p>
    <h1 class="mirror-row">
     <span class="mirror-left latin">
      Pācittiya 33
     </span>
     <span class="mirror-right">
     </span>
    </h1>
   </header>
   <p>
    <a class="ref sc" href="#sc3" id="sc3">
     SC 3
    </a>
    若比丘尼作是語。如我解
    <a class="ref t" href="#t0085c28" id="t0085c28">
     T 0085c28
    </a>
    佛所說。障道法不能障道。諸比丘尼語是比
    <a class="ref t" href="#t0085c29" id="t0085c29">
     T 0085c29
    </a>
    丘尼。汝莫作是語。莫謗佛莫誣佛。佛說障道
    <a class="ref t" href="#t0086a01" id="t0086a01">
     T 0086a01
    </a>
    法實能障道。汝捨是惡邪見。如是諫堅持不
    <a class="ref t" href="#t0086a02" id="t0086a02">
     T 0086a02
    </a>
    捨。應第二第三諫。第二第三諫。捨是事善。
    <a class="ref t" href="#t0086a03" id="t0086a03">
     T 0086a03
    </a>
    不捨者波逸提。
   </p>
