<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 4</span> <span class='mirror-right'>捨墮法四</span></h1>
</header>
<p>若比丘尼從非親里 <a class='ref t' id='t0083a27' href='#t0083a27'>T 0083a27</a> 居士居士婦乞衣除因緣尼薩耆波逸提。因緣 <a class='ref t' id='t0083a28' href='#t0083a28'>T 0083a28</a> 者。奪衣失衣燒衣漂衣衣壞。是名因緣。
</p>
