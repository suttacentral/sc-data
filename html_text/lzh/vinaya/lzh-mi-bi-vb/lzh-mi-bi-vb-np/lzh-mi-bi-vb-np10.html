<header class='mirror'>
<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 10</span> <span class='mirror-right'>捨墮法十</span></h1>
</header>
<p>若居士居士婦為比丘尼使織 <a class='ref t' id='t0083b29' href='#t0083b29'>T 0083b29</a> 師織作衣。是比丘尼先不自恣請。便到織師 <a class='ref t' id='t0083c01' href='#t0083c01'>T 0083c01</a> 所作是言。汝知不。此衣為我作。汝為我好織 <a class='ref t' id='t0083c02' href='#t0083c02'>T 0083c02</a> 令極緻廣。當別相報。後若與一食若一食 <a class='ref t' id='t0083c03' href='#t0083c03'>T 0083c03</a> 直。得者尼薩耆波逸提。
</p>
