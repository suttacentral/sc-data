<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 2</span> <span class='mirror-right'>捨墮法二</span></h1>
</header>
<p>若比丘尼衣竟捨 <a class='ref t' id='t0083a22' href='#t0083a22'>T 0083a22</a> 迦絺那衣已五衣中若離一一衣宿過一夜除 <a class='ref t' id='t0083a23' href='#t0083a23'>T 0083a23</a> 僧羯磨尼薩耆波逸提。
</p>
