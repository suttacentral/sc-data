<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 13</span> <span class='mirror-right'>捨墮法十三</span></h1>
</header>
<p>若比 <a class='ref t' id='t0083c07' href='#t0083c07'>T 0083c07</a> 丘尼病得服四種含消藥酥油蜜石蜜。一受 <a class='ref t' id='t0083c08' href='#t0083c08'>T 0083c08</a> 乃至七日。若過尼薩耆波逸提。
</p>
