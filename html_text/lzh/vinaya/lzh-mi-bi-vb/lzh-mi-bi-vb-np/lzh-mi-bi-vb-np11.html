<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 11</span> <span class='mirror-right'>捨墮法十一</span></h1>
</header>
<p>若比丘尼與比丘尼 <a class='ref t' id='t0083c04' href='#t0083c04'>T 0083c04</a> 衣。後瞋不喜。若自奪。若使人奪。作是語。還 <a class='ref t' id='t0083c05' href='#t0083c05'>T 0083c05</a> 我衣不與汝尼薩耆波逸提。
</p>
