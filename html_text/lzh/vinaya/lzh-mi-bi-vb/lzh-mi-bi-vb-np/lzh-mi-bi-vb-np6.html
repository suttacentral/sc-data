<article id='lzh-mi-bi-vb-np6' lang='lzh'>
<header class='mirror'>
<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 6</span> <span class='mirror-right'>捨墮法六</span></h1>
</header>
<p>若非親里居士居士婦共議。當以如是衣 <a class='ref t' id='t0083b04' href='#t0083b04'>T 0083b04</a> 直作衣與某甲比丘尼。是比丘尼先不自恣 <a class='ref t' id='t0083b05' href='#t0083b05'>T 0083b05</a> 請。便往問居士居士婦言。汝為我以如是衣 <a class='ref t' id='t0083b06' href='#t0083b06'>T 0083b06</a> 直作衣不。答言如是。便言善哉。居士居士婦。 <a class='ref t' id='t0083b07' href='#t0083b07'>T 0083b07</a> 可作如是如是衣與我。為好故尼薩耆波逸 <a class='ref t' id='t0083b08' href='#t0083b08'>T 0083b08</a> 提。
</p>
