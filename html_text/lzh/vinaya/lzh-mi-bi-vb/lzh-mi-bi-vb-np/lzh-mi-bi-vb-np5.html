<header class='mirror'>
<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 5</span> <span class='mirror-right'>捨墮法五</span></h1>
</header>
<p>若 <a class='ref t' id='t0083a29' href='#t0083a29'>T 0083a29</a> 比丘尼奪衣失衣燒衣漂衣衣壞。從非親里 <a class='ref t' id='t0083b01' href='#t0083b01'>T 0083b01</a> 居士居士婦乞衣。若居士居士婦欲多與衣。 <a class='ref t' id='t0083b02' href='#t0083b02'>T 0083b02</a> 是比丘尼應受二衣。若過是受尼薩耆波逸 <a class='ref t' id='t0083b03' href='#t0083b03'>T 0083b03</a> 提。
</p>
