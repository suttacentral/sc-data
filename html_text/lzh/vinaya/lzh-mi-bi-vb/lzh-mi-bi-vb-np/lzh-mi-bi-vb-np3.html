<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 3</span> <span class='mirror-right'>捨墮法三</span></h1>
</header>
<p>若比丘尼衣竟捨迦絺 <a class='ref t' id='t0083a24' href='#t0083a24'>T 0083a24</a> 那衣已得非時衣。若須應受速作受持。若足 <a class='ref t' id='t0083a25' href='#t0083a25'>T 0083a25</a> 者善。若不足望更有得處令具足成乃至一 <a class='ref t' id='t0083a26' href='#t0083a26'>T 0083a26</a> 月。若過尼薩耆波逸提。
</p>
