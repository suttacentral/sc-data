<article id='lzh-mi-bi-vb-np7' lang='lzh'>
<header class='mirror'>
<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 7</span> <span class='mirror-right'>捨墮法七</span></h1>
</header>
<p>若非親里居士居士婦共議。我當各以如 <a class='ref t' id='t0083b09' href='#t0083b09'>T 0083b09</a> 是衣直作衣與某甲比丘尼。是比丘尼先不自 <a class='ref t' id='t0083b10' href='#t0083b10'>T 0083b10</a> 恣請。便往問居士居士婦言。汝各為我以如 <a class='ref t' id='t0083b11' href='#t0083b11'>T 0083b11</a> 是衣直作衣不。答言如是。便言善哉。居士居 <a class='ref t' id='t0083b12' href='#t0083b12'>T 0083b12</a> 士婦。可合作一衣與我。為好故尼薩耆波逸 <a class='ref t' id='t0083b13' href='#t0083b13'>T 0083b13</a> 提。
</p>
