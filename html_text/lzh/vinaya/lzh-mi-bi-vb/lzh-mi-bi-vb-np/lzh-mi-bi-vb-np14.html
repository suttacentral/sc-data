<p class='division'><span class='mirror-left latin'>Mahīśāsaka Vinaya</span> <span class='mirror-right'>五分律（彌沙塞）</span></p>
<p class='mirror-row'><span class='mirror-left latin'>Bhikkhunī Vibhaṅga</span> <span class='mirror-right'>比丘尼分</span></p>
<h1 class='mirror-row'><span class='mirror-left latin'>Nissaggiya Pācittiya 14</span> <span class='mirror-right'>捨墮法十四</span></h1>
</header>
<p>若比丘尼前 <a class='ref t' id='t0083c09' href='#t0083c09'>T 0083c09</a> 後安居十日未至自恣。得急施衣若須應受 <a class='ref t' id='t0083c10' href='#t0083c10'>T 0083c10</a> 乃至衣時。若過尼薩耆波逸提。
</p>
