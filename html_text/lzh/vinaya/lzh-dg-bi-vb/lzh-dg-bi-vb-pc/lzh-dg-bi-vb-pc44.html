</header>
<a class='t-juannumber' id='t-juannumber25' href='#t-juannumber25'></a>
<p class='suttainfo'><span class='t-juanname'>四分律卷第二十五<span class='t-note'>（二分之四明尼戒法）</span><a class='ref t' id='t0735c12' href='#t0735c12'>T 0735c12</a><a class='ref t' id='t0735c13' href='#t0735c13'>T 0735c13</a></span><br>
<span class='scribe'>姚秦罽賓三藏佛陀耶舍<a class='ref t' id='t0735c14' href='#t0735c14'>T 0735c14</a>共竺佛念等譯</span><a class='ref t' id='t0735c15' href='#t0735c15'>T 0735c15</a><br>
<span class='t-headname'>◎一百七十八單提法之二</span><a class='ref t' id='t0735c16' href='#t0735c16'>T 0735c16</a></p>
<p> 若比丘尼。淨施比丘比丘尼式叉摩那沙彌<a class='ref t' id='t0735c17' href='#t0735c17'>T 0735c17</a>沙彌尼衣。後不問主取著者。波逸提。<span class='rule-number'>四十四</span></p>
